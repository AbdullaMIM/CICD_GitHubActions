# Name of the workflow as it appears in GitHub - Actions UI
name: GitHub Actions CI

# Define when this workflow will run
on:
  workflow_dispatch: # Allow manual triggering from GitHub UI
  push:
    branches:
      - master # Run automatically when code is pushed to master branch

# Environment variables used throughout the workflow
env:
  AZURE_WEBAPP_NAME: dev-ghactions
  DOTNET_VERSION: '8.x'
  SOLUTION_PATH: 'CICD_GitHubActions.slnx'
  APP_PROJECT_PATH: 'CICD_GitHubActions.csproj'
  PUBLISH_DIR: './publish'
  AZURE_WEBAPP_PACKAGE_PATH: './publish'

# Define the separate jobs that make up this workflow
jobs:
  # First job: build and test the application
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest # Use Ubuntu runner for this job

    steps:
      - uses: actions/checkout@v4    # Downloads GitHub repository into the runner.

      - name: Setup .NET             # Installs .NET 8.x on the runner.
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore                # Downloads NuGet packages (dependencies).
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build                  # Compile / build the application in Release mode.
        run: dotnet build ${{ env.SOLUTION_PATH }}
          --configuration Release
          --no-restore

      - name: Test                   # Runs unit tests to make sure nothing is broken in Release mode.
        run: dotnet test ${{ env.SOLUTION_PATH }}
          --configuration Release
          --no-restore
          --no-build
          --verbosity normal

      - name: Publish                # Creates deployable output (DLLs, config files, etc.) in the publish folder.
        run: dotnet publish ${{ env.APP_PROJECT_PATH }}
          --configuration Release
          --no-restore
          --no-build
          --property:PublishDir=${{ env.PUBLISH_DIR }}

      # Store the published output as an artifact for later jobs.
      - name: Publish Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webapp  # Name of the artifact
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

  # Second job: deploy the application to Azure
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: [build-and-test]  # This job depends on the build-and-test job (Ensures deployment only runs after build succeeds)

    steps:
      # Retrieve the artifacts from the build job
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: webapp
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      # Deploy to Azure App Service using publish profile credentials
      - name: Deploy
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          # Authentication credentials stored as a secret
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: '${{ env.AZURE_WEBAPP_PACKAGE_PATH }}'
